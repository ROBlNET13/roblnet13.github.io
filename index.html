<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROBINET13</title>
  <script src="script.js"></script>
  <link rel="icon" href="/images/favicon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="window main-window">
    <div class="window-background"></div>
    <div class="window-header">
      <img src="images/SmileIcon.png" class="window-icon" />
      <div class="window-title">SmileOS 2.0</div>

      <div class="window-icon button-square" onclick="playSound('audio/smileOS2Error.wav')"></div>
      <div class="window-icon button-plus" onclick="playSound('audio/smileOS2Error.wav')"></div>
      <div class="window-icon button-dot" onclick="playSound('audio/smileOS2Error.wav')"></div>
    </div>
    <div class="window-container">
      <div class="window-page main-page">
        <img src="images/SmileOS.png" class="smileos-logo" />
        <div class="window totd-window">
          <div class="window-background"></div>
          <div class="window-header">
            <img src="images/LightIcon.png" class="window-icon" />
            <div class="window-title">Tip of the Day</div>

            <div class="window-icon button-square" onclick="playSound('audio/smileOS2Error.wav')"></div>
            <div class="window-icon button-plus" onclick="playSound('audio/smileOS2Error.wav')"></div>
            <div class="window-icon button-dot" onclick="playSound('audio/smileOS2Error.wav')"></div>
          </div>
          <div class="window-container">
            <div class="inset-dark">
              <div class="inset-dark-background"></div>
              <div id="tip-text"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
